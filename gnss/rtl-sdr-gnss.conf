; Custom GNSS-SDR configuration for an RTL-SDR dongle (RTL2832U).
; Based on the upstream example shipped with gnss-sdr 0.0.21:
;   share/gnss-sdr/conf/RealTime_input/gnss-sdr_GPS_L1_rtlsdr_realtime.conf
; Prior art / docs:
;   https://gnss-sdr.org/docs/tutorials/gnss-sdr-operation-realtek-rtl2832u-usb-dongle-dvb-t-receiver/
;
; Run with:
;   ./run.sh
; (equivalent: gnss-sdr --config_file=./rtl-sdr-gnss.conf --log_dir=./logs)
;
; IMPORTANT - per-dongle calibration (see below):
;   1. Sample rate: every RTL2832U has a slightly off 28.8 MHz clock. Measure your
;      actual rate with front-end-cal and put it in the three *_sampling_frequency
;      / internal_fs_sps settings. The values below (2.0 MSPS nominal, 1999898
;      actual) are the upstream example values - a sane starting point.
;   2. Oscillator offset: a cheap crystal can be tens of ppm off at 1575.42 MHz,
;      which shows up as an IF offset. The example uses 80558 Hz (~51 ppm). Leave
;      this as a starting point; the acquisition stage searches +/-10 kHz Doppler,
;      so a good crystal (e.g. RTL-SDR Blog V3 TCXO, <1 ppm) can use IF=0.

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
; internal_fs_sps: internal sample rate after signal conditioning [sps].
; Set to your calibrated dongle rate.
GNSS-SDR.internal_fs_sps=1999898

;######### SUPL RRLP GPS assistance configuration #####
GNSS-SDR.SUPL_gps_enabled=false
GNSS-SDR.SUPL_read_gps_assistance_xml=false
GNSS-SDR.SUPL_gps_ephemeris_server=supl.google.com
GNSS-SDR.SUPL_gps_ephemeris_port=7275
GNSS-SDR.SUPL_gps_acquisition_server=supl.google.com
GNSS-SDR.SUPL_gps_acquisition_port=7275
GNSS-SDR.SUPL_MCC=244
GNSS-SDR.SUPL_MNC=5
GNSS-SDR.SUPL_LAC=0x59e2
GNSS-SDR.SUPL_CI=0x31b0

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=Osmosdr_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=2000000
SignalSource.freq=1575420000
SignalSource.gain=40
SignalSource.rf_gain=40
SignalSource.if_gain=30
SignalSource.AGC_enabled=false
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.dump=false
SignalSource.dump_filename=./signal_source.dat

;# If your dongle has a bias-tee (e.g. RTL-SDR Blog V3) and you are using an
;# active GPS antenna, uncomment the next line. Requires gr-osmosdr >= 0.1.4-13;
;# with older gr-osmosdr use the rtl_biast utility before starting gnss-sdr.
;SignalSource.osmosdr_args=rtl,bias=1

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner

;######### DATA_TYPE_ADAPTER CONFIG ############
DataTypeAdapter.implementation=Pass_Through

;######### INPUT_FILTER CONFIG ############
InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.dump=false
InputFilter.dump_filename=./input_filter.dat
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.45
InputFilter.band2_begin=0.55
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
; Set to your calibrated dongle rate.
InputFilter.sampling_frequency=1999898
; IF deviation due to front-end LO inaccuracies [Hz]. 0 for a good TCXO dongle.
InputFilter.IF=80558

;######### RESAMPLER CONFIG ############
Resampler.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=4
Channels.in_acquisition=1
Channel.signal=1C

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition_Fine_Doppler
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.threshold=0.015
;Acquisition_1C.pfa=0.0001
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_min=-10000
Acquisition_1C.doppler_step=500
Acquisition_1C.max_dwells=15
Acquisition_1C.dump=false
Acquisition_1C.dump_filename=./acq_dump.dat

;######### TRACKING GLOBAL CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.dump=false
Tracking_1C.dump_filename=./tracking_ch_
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.order=3
Tracking_1C.early_late_space_chips=0.5

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_filename=./observables.dat

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
; Single is the right mode for a plain RTL-SDR fix (no precise products needed).
; Options: Single, Static, Kinematic, PPP_Static, PPP_Kinematic
PVT.positioning_mode=Single
PVT.iono_model=Broadcast ; options: OFF, Broadcast, SBAS, Iono-Free-LC, Estimate_STEC, IONEX
PVT.trop_model=Saastamoinen ; options: OFF, Saastamoinen, SBAS, Estimate_ZTD, Estimate_ZTD_Grad
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.nmea_dump_filename=./gnss_sdr_pvt.nmea
PVT.flag_nmea_tty_port=false
PVT.nmea_dump_devname=/dev/pts/4
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.rtcm_dump_devname=/dev/pts/1
PVT.dump=true
PVT.dump_filename=./PVT
